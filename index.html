<!DOCTYPE html>
<html lang="ur">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Black Iframe Player</title>
    <meta name="description"
        content="A minimalist pure black page featuring an embedded iframe player with ad placements.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px 0;
        }

        /* Outer Page Wrapper */
        .page-container {
            width: 100%;
            max-width: 1120px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        /* Main Section Wrapper */
        .main-container {
            width: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
        }

        /* Player & Vertical Ads Column */
        .player-column {
            flex: 1;
            max-width: 760px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Top Ad Banner Container (Centered directly above player) */
        .ad-top {
            width: 100%;
            max-width: 728px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            border: 1px solid #111111;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Player Layout */
        .player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 1);
            position: relative;
        }

        .iframe-box {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000000;
            border: 1px solid #111111;
        }

        .iframe-box iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }

        /* Bottom Ad Banner Container (Centered directly under player) */
        .ad-bottom {
            width: 100%;
            max-width: 468px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            border: 1px solid #111111;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Right Sidebar Ad Container */
        .ad-sidebar {
            width: 300px;
            height: 250px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            border: 1px solid #111111;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 110px;
            /* Align nicely alongside the player box */
        }

        /* Responsive Layout for smaller screens */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }

            .player-column {
                max-width: 100%;
            }

            .ad-top {
                max-width: 100%;
            }

            .ad-bottom {
                max-width: 100%;
            }

            .ad-sidebar {
                margin-top: 0;
            }
        }

        /* Fullscreen mode support via F key */
        :fullscreen .player-container,
        :-webkit-full-screen .player-container {
            max-width: 100vw;
            width: 100vw;
            height: 100vh;
            aspect-ratio: auto;
            border-radius: 0;
        }

        :fullscreen .iframe-box,
        :-webkit-full-screen .iframe-box {
            border-radius: 0;
            border: none;
        }

        :fullscreen .ad-sidebar,
        :-webkit-full-screen .ad-sidebar,
        :fullscreen .ad-top,
        :-webkit-full-screen .ad-top,
        :fullscreen .ad-bottom,
        :-webkit-full-screen .ad-bottom {
            display: none;
        }
    </style>
</head>

<body>
    <div class="page-container">
        <main class="main-container">
            <!-- Center Column containing Top Ad + Player + Bottom Ad -->
            <div class="player-column">
                <!-- Top Ad Banner (Centered directly above player) -->
                <header class="ad-top">
                    <script>
                        atOptions = {
                            'key': 'e825b0a421f6a287fe0ef8cc74b70f92',
                            'format': 'iframe',
                            'height': 90,
                            'width': 728,
                            'params': {}
                        };
                    </script>
                    <script src="https://www.highrevenueformat.com/e825b0a421f6a287fe0ef8cc74b70f92/invoke.js"></script>
                </header>

                <!-- Player Container -->
                <div class="player-container" id="playerContainer">
                    <div class="iframe-box">
                        <iframe id="mainIframe" src="https://streame.center/embed/ch30.php"
                            title="Embedded Iframe Player" width="100%" height="100%" frameborder="0"
                            allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen>
                        </iframe>
                    </div>
                </div>

                <!-- Bottom Ad Banner (Centered directly under player) -->
                <footer class="ad-bottom">
                    <script>
                        atOptions = {
                            'key': '3dd9d0dbe16b910ade5a4fe7a2db5b8e',
                            'format': 'iframe',
                            'height': 60,
                            'width': 468,
                            'params': {}
                        };
                    </script>
                    <script src="https://www.highrevenueformat.com/3dd9d0dbe16b910ade5a4fe7a2db5b8e/invoke.js"></script>
                </footer>
            </div>

            <!-- Right Ad Sidebar -->
            <aside class="ad-sidebar">
                <script>
                    atOptions = {
                        'key': '6119459cd108020ea4a7c3b63cd8d423',
                        'format': 'iframe',
                        'height': 250,
                        'width': 300,
                        'params': {}
                    };
                </script>
                <script src="https://www.highrevenueformat.com/6119459cd108020ea4a7c3b63cd8d423/invoke.js"></script>
            </aside>
        </main>
    </div>

    <script>
        // Press 'F' key for fullscreen toggle
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f') {
                const container = document.getElementById('playerContainer');
                if (!document.fullscreenElement) {
                    if (container.requestFullscreen) {
                        container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                        container.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            }
        });
    </script>
</body>

</html>
